<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon CV | [Prénom] [Nom]</title>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Core CSS (same as index for consistency) -->
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    /* Specific overrides for the CV page */
    body {
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .cv-header {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .cv-title {
      font-size: 2rem;
      margin: 0;
    }

    .pdf-container {
      width: 100%;
      max-width: 1000px;
      height: 80vh; /* Takes most of the screen */
      background: var(--bg-surface);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 10px 30px -15px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    
    .fallback-text {
      color: var(--text-muted);
      text-align: center;
      padding: 2rem;
    }
  </style>
</head>
<body>

  <div class="cv-header">
    <h1 class="cv-title">Mon <span class="highlight">CV</span></h1>
    <div class="cv-actions">
      <!-- Lien retour vers le portfolio -->
      <a href="index.html" class="btn-outline"><i class="fa-solid fa-arrow-left"></i> Retour au Portfolio</a>
      <!-- Lien de téléchargement direct (optionnel) -->
      <a href="assets/CV_Titouan_Vissouarn.pdf" class="btn-primary" download><i class="fa-solid fa-download"></i> Télécharger</a>
    </div>
  </div>

  <div class="pdf-container">
    <!-- Affichage du PDF -->
    <iframe src="assets/CV_Titouan_Vissouarn.pdf">
      <div class="fallback-text">
        <p>Votre navigateur ne permet pas l'affichage direct du PDF.</p>
        <p><a href="assets/CV_Titouan_Vissouarn.pdf" class="btn-primary" style="margin-top: 1rem;">Télécharger le CV</a></p>
      </div>
    </iframe>
  </div>

</body>
</html>
